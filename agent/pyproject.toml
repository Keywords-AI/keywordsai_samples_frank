[project]
name = "respan-integration-agent"
version = "0.0.1"
description = "Respan onboarding agent — clones a repo, integrates Respan tracing/gateway, opens a PR (dogfoods tracing + gateway + evals)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.6",
  "claude-agent-sdk>=0.1.58",
  "respan-ai>=0.1",
  "respan-instrumentation-claude-agent-sdk>=0.1",
]

[project.scripts]
respan-integration-agent = "respan_integration_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respan_integration_agent"]
